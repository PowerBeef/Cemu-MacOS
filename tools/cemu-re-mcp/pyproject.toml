[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cemu_re_mcp"
version = "0.0.1"
description = "MCP server wrapping Cemu's GDB stub for Wii U runtime reverse engineering"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2,<1.7",
]

[project.scripts]
cemu-re-mcp = "cemu_re_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
