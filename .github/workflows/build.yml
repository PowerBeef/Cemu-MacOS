name: Build TesseraEmu

# TesseraEmu builds for Apple Silicon on macOS 26 and nothing else. The Linux,
# AppImage and Windows jobs that used to live here could not have succeeded:
# src/Common/precompiled.h #errors on any target other than arm64, and the only
# renderer left is Metal. They are gone rather than left failing.

on:
  workflow_call:
    inputs:
      next_version_major:
        required: false
        type: string
      next_version_minor:
        required: false
        type: string

env:
  # Plain directory caching via actions/cache. The old NuGet-on-mono setup this
  # replaces needed a package-registry token and a mono runtime on the runner to
  # cache what is, in the end, a folder of archives.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  build-macos:
    name: build-macos-arm64
    # arm64 image. Pinned rather than macos-latest: the deployment target is a
    # hard 26.0, so an image migration must be a deliberate edit here, not a
    # silent change under us.
    runs-on: macos-26

    steps:
    - name: "Checkout repo"
      uses: actions/checkout@v6
      with:
        submodules: "recursive"

    - name: "Setup release mode parameters"
      run: |
        echo "BUILD_MODE=Release" >> $GITHUB_ENV
        echo "BUILD_FLAGS=" >> $GITHUB_ENV

    - name: "Setup build flags for version"
      if: ${{ inputs.next_version_major != '' }}
      run: |
        echo "[INFO] Version ${{ inputs.next_version_major }}.${{ inputs.next_version_minor }}"
        echo "BUILD_FLAGS=${{ env.BUILD_FLAGS }} -DEMULATOR_VERSION_MAJOR=${{ inputs.next_version_major }} -DEMULATOR_VERSION_MINOR=${{ inputs.next_version_minor }}" >> $GITHUB_ENV

    - name: "Check the toolchain can target macOS 26"
      run: |
        xcodebuild -version
        SDK=$(xcrun --sdk macosx --show-sdk-version)
        echo "macOS SDK: $SDK"
        # CMAKE_OSX_DEPLOYMENT_TARGET is 26.0. Without this check, an older SDK
        # fails somewhere deep in the build with an unrelated-looking error.
        if [ "$(printf '%s\n26.0\n' "$SDK" | sort -V | head -1)" != "26.0" ]; then
          echo "::error::SDK $SDK cannot target macOS 26.0 -- the runner image moved"
          exit 1
        fi

    # Seconds, and it runs before the 20-minute build rather than after it. A
    # stray double hyphen in a comment made these files illegal XML and broke
    # every bundle build with "AMFIUnserializeXML: syntax error". plutil -lint
    # accepts that file happily; xmllint is the one that catches it.
    - name: "Lint the entitlements files"
      run: xmllint --noout dist/macos/TesseraEmu.entitlements dist/macos/TesseraEmu.debug.entitlements

    - name: "Install system dependencies"
      run: brew install pkgconf nasm automake autoconf libtool ninja

    - name: "Restore vcpkg binary cache"
      uses: actions/cache@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        # vcpkg validates each package's own ABI hash, so a stale restore costs
        # a rebuild of the changed ports and never yields a wrong binary.
        key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', '.gitmodules') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ runner.arch }}-

    - name: "cmake"
      run: |
        mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"   # vcpkg errors if it is absent
        cmake -S . -B build ${{ env.BUILD_FLAGS }} \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_MODE }} \
          -DMACOS_BUNDLE=ON \
          -G Ninja

    - name: "Build TesseraEmu"
      run: cmake --build build

    # The build signs the bundle itself (src/CMakeLists.txt), so there is no
    # codesign step here. What CI adds is the assertion that it worked: the
    # entitlements file was missing from the repo entirely until the rebrand,
    # and nothing would have noticed.
    - name: "Verify the signature and entitlements"
      run: |
        APP=bin/TesseraEmu.app
        codesign --verify --strict --verbose=2 "$APP"
        codesign -d --entitlements - "$APP" 2>&1 | tee entitlements.txt
        if ! grep -q 'com.apple.security.cs.allow-jit' entitlements.txt; then
          echo "::error::bundle has no JIT entitlement -- the recompiler cannot allocate code under the hardened runtime"
          exit 1
        fi
        if grep -q 'com.apple.security.get-task-allow' entitlements.txt; then
          echo "::error::release bundle carries get-task-allow, which fails notarization"
          exit 1
        fi
        otool -l "$APP/Contents/MacOS/TesseraEmu" | grep -A3 LC_BUILD_VERSION

    # `codesign --verify --strict` passes on a bundle that dyld then refuses to
    # load, so verification alone is not enough -- an ad-hoc signature without
    # disable-library-validation produces exactly that. --help is a complete
    # load-time test: libusb is a link-time dependency, so if library validation
    # rejects it the process dies before printing a single line.
    - name: "Smoke test: the signed bundle starts"
      run: ./bin/TesseraEmu.app/Contents/MacOS/TesseraEmu --help

    - name: "Package DMG"
      run: |
        mkdir -p bin/dmg
        # ditto, not cp: it preserves the bundle's extended attributes, and a
        # copy that loses them is a copy with a broken signature.
        ditto bin/TesseraEmu.app bin/dmg/TesseraEmu.app
        ln -s /Applications bin/dmg/Applications
        hdiutil create bin/tmp.dmg -ov -volname "TesseraEmu" -fs HFS+ -srcfolder bin/dmg
        hdiutil convert bin/tmp.dmg -format UDZO -o bin/TesseraEmu.dmg
        rm bin/tmp.dmg

    - name: "Upload artifact"
      uses: actions/upload-artifact@v6
      with:
        name: tesseraemu-macos-arm64
        path: ./bin/TesseraEmu.dmg
        if-no-files-found: error
