name: Generate translation template

on:
  pull_request:
    paths-ignore:
      - "*.md"
    types:
      - opened
      - synchronize
      - reopened
  push:
    paths-ignore:
      - "*.md"
    branches:
      - main

jobs:
  generate-pot:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v6

      - name: "Install gettext"
        run: |
          sudo apt update -qq
          sudo apt install -y gettext

      # The catalog is still named "cemu": renaming it would orphan every .mo
      # file under bin/resources/ across 19 locales for no benefit, so CemuApp
      # still loads the "cemu" catalog and this template has to match it.
      - name: "Generate POT file using xgettext"
        run: >
          find src \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) |
          xargs xgettext --from-code=utf-8 -w 100
          --keyword="_" --keyword="wxTRANSLATE" --keyword="wxPLURAL:1,2"
          --keyword="_tr" --keyword="TR_NOOP"
          --check=space-ellipsis --omit-header
          -o cemu.pot

      # The .po sources and the .mo files the app loads are both committed, because an
      # ordinary build must not require gettext. Both being in the tree means they can
      # drift, so check they cannot: every .mo must be exactly what its .po compiles to.
      - name: "Catalogs match their sources"
        run: |
          fail=0
          for po in translations/*.po; do
            loc=$(basename "$po" .po)
            mo="bin/resources/$loc/cemu.mo"
            if [ ! -f "$mo" ]; then
              echo "::error::$po has no compiled catalog at $mo"; fail=1; continue
            fi
            # Compare CONTENT, not bytes. msgfmt output is not guaranteed identical across
            # gettext versions, and this runner's is not the one a contributor on macOS has,
            # so a byte diff would fail on a difference nobody can act on. Round-tripping
            # both through msgcat --sort-output normalises ordering and wrapping and leaves
            # only the msgid/msgstr pairs, which is what actually has to match.
            # sed: one such difference is already known -- this runner's msgfmt preserves
            # `charset=utf-8` from the .po while Homebrew's normalises it to `UTF-8`, so the
            # header alone differed and failed the whole check. Canonicalise it rather than
            # reporting a mismatch a contributor cannot reproduce or act on.
            msgfmt --check-format -o "/tmp/$loc.mo" "$po"
            msgunfmt "/tmp/$loc.mo" | msgcat --sort-output --no-wrap - \
              | sed 's/charset=utf-8/charset=UTF-8/I' > "/tmp/$loc.from-po"
            msgunfmt "$mo"          | msgcat --sort-output --no-wrap - \
              | sed 's/charset=utf-8/charset=UTF-8/I' > "/tmp/$loc.from-mo"
            if ! cmp -s "/tmp/$loc.from-po" "/tmp/$loc.from-mo"; then
              echo "::error::$mo does not match $po -- run 'cmake --build build --target translations' and commit the result"
              diff "/tmp/$loc.from-mo" "/tmp/$loc.from-po" | head -20
              fail=1
            fi
          done
          for mo in bin/resources/*/cemu.mo; do
            loc=$(basename "$(dirname "$mo")")
            [ -f "translations/$loc.po" ] || { echo "::error::$mo has no source at translations/$loc.po"; fail=1; }
          done
          exit $fail

      # Reports which msgids the catalogs are missing or carrying stale. Informational:
      # a translation lagging the source is normal and must not fail the build.
      - name: "Translation coverage"
        run: |
          printf '%-6s %8s %8s %8s\n' locale translated fuzzy untranslated
          for po in translations/*.po; do
            msgmerge --quiet --no-fuzzy-matching -o /tmp/merged.po "$po" cemu.pot
            stats=$(msgfmt --statistics -o /dev/null /tmp/merged.po 2>&1 | tr -d '\n')
            printf '%-6s %s\n' "$(basename "$po" .po)" "$stats"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: POT file
          path: ./cemu.pot
          if-no-files-found: error