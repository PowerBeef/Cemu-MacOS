name: Deploy release

on:
  workflow_dispatch:
    inputs:
      changelog0:
        description: 'Enter the changelog lines for this release. Each line is a feature / bullet point. Do not use dash.'
        required: true
        type: string
      changelog1:
        description: 'Feature 2'
        required: false
        type: string
      changelog2:
        description: 'Feature 3'
        required: false
        type: string
      changelog3:
        description: 'Feature 4'
        required: false
        type: string
      changelog4:
        description: 'Feature 5'
        required: false
        type: string
      changelog5:
        description: 'Feature 6'
        required: false
        type: string
      changelog6:
        description: 'Feature 7'
        required: false
        type: string
      changelog7:
        description: 'Feature 8'
        required: false
        type: string
      changelog8:
        description: 'Feature 9'
        required: false
        type: string
      changelog9:
        description: 'Feature 10'
        required: false
        type: string

permissions:
  contents: write

jobs:
  calculate-version:
    name: Calculate Version
    uses: ./.github/workflows/determine_release_version.yml

  call-release-build:
    uses: ./.github/workflows/build.yml
    needs: calculate-version
    with:
      next_version_major: ${{ needs.calculate-version.outputs.next_version_major }}
      next_version_minor: ${{ needs.calculate-version.outputs.next_version_minor }}

  deploy:
    name: Deploy release
    runs-on: ubuntu-24.04
    needs: [call-release-build, calculate-version]
    steps:
      - uses: actions/checkout@v6

      # There is one artifact now. The Windows zip, NSIS installer, Linux zip
      # and AppImage steps that used to be here downloaded artifacts from jobs
      # this fork cannot run.
      - uses: actions/download-artifact@v8
        with:
          name: tesseraemu-macos-arm64
          path: artifact

      - name: Generate changelog
        run: |
          CHANGELOG=""
          for i in $(seq 0 9); do
            LINE=$(jq -r ".inputs.changelog$i // empty" "$GITHUB_EVENT_PATH")
            [ -n "$LINE" ] && CHANGELOG="$CHANGELOG- $LINE"$'\n'
          done
          # A multi-line value needs the heredoc form of GITHUB_ENV. The old
          # version appended a string containing literal \n and then unescaped
          # it later, which only ever survived as its first line.
          {
            echo 'RELEASE_BODY<<CHANGELOG_EOF'
            echo '**Changelog:**'
            printf '%s' "$CHANGELOG"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_ENV"

      - name: Assemble upload
        run: |
          VERSION="${{ needs.calculate-version.outputs.next_version }}"
          echo "Version: $VERSION"
          mkdir upload
          mv artifact/TesseraEmu.dmg "upload/tesseraemu-$VERSION-macos-arm64.dmg"
          ls -l upload

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.calculate-version.outputs.next_version }}"
          echo "[INFO] Release tag: v$VERSION"
          # gh is preinstalled. It replaces a step that fetched a 2019 build of
          # a third-party release tool over the network on every run.
          gh release create "v$VERSION" \
            --draft \
            --title "TesseraEmu $VERSION" \
            --notes "$RELEASE_BODY" \
            upload/*
