name: Calculate Next Version from release history

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      next_version:
        description: "The next semantic version"
        value: ${{ jobs.calculate-version.outputs.next_version }}
      next_version_major:
        description: "The next semantic version (major)"
        value: ${{ jobs.calculate-version.outputs.next_version_major }}
      next_version_minor:
        description: "The next semantic version (minor)"
        value: ${{ jobs.calculate-version.outputs.next_version_minor }}

jobs:
  calculate-version:
    runs-on: ubuntu-24.04
    outputs:
      next_version: ${{ steps.calculate_next_version.outputs.next_version }}
      next_version_major: ${{ steps.calculate_next_version.outputs.next_version_major }}
      next_version_minor: ${{ steps.calculate_next_version.outputs.next_version_minor }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Calculate next semver minor
        id: calculate_next_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Authenticated through gh rather than bare curl: the unauthenticated
          # API is rate-limited per runner IP, which is shared. Kept as its own
          # command so that an API failure is fatal, while "no releases yet" --
          # grep finding nothing -- is not.
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[].tag_name' > tags.txt

          LATEST=$(grep -E '^v[0-9]+\.[0-9]+(-[0-9]+)?$' tags.txt \
                   | sed 's/-.*//' | sort -V | tail -n 1 || true)

          if [ -z "$LATEST" ]; then
            # TesseraEmu has no release history yet, and the upstream version
            # numbers do not carry over to a fork with its own identity. The old
            # workflow exited 1 here, so Deploy release could never produce a
            # first release -- it required one to already exist.
            MAJOR=0
            MINOR=1
            echo "No prior release found; starting at $MAJOR.$MINOR"
          else
            echo "Latest release: $LATEST"
            VERSION=${LATEST#v}
            MAJOR=${VERSION%%.*}
            MINOR=${VERSION#*.}
            MINOR=$((MINOR + 1))
          fi

          echo "Next version: $MAJOR.$MINOR"
          # ::set-output was disabled by GitHub in 2023; the old form here was
          # silently producing empty outputs.
          {
            echo "next_version=$MAJOR.$MINOR"
            echo "next_version_major=$MAJOR"
            echo "next_version_minor=$MINOR"
          } >> "$GITHUB_OUTPUT"
