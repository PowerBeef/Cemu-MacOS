name: Build check
on:
  # Manual trigger, for asking for a build without pushing. Push-triggered runs
  # were dead for a while: GitHub disables a fork's workflows until the owner
  # opts in from the Actions tab, and workflow_dispatch was the only event that
  # bypassed it. That opt-in has since been given.
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "*.md"
    types:
      - opened
      - synchronize
      - reopened
  push:
    paths-ignore:
      - "*.md"
    branches:
      - main

jobs:
  build:
    uses: ./.github/workflows/build.yml
