name: Build check
on:
  # Manual trigger. Push-triggered runs do not fire on this repository: it is
  # still a fork of cemu-project/Cemu, and GitHub gates a fork's Actions behind
  # a one-time opt-in in the Actions tab. workflow_dispatch is an explicit user
  # action and runs regardless, so this is also the way to get CI on demand.
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "*.md"
    types:
      - opened
      - synchronize
      - reopened
  push:
    paths-ignore:
      - "*.md"
    branches:
      - main

jobs:
  build:
    uses: ./.github/workflows/build.yml
