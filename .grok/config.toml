# Project-scoped Grok config (TesseraEmu)
#
# cemu-re: guest PowerPC GDB (port 1337). Launch with --enable-gdbstub.
#   setup: ./tools/cemu-re-mcp/setup.sh
#
# tessera-playtest: autonomous launch / keyboard GamePad / screenshot / scenarios.
#   setup: ./tools/tessera-playtest/setup.sh
#   Requires Accessibility + frontmost window for input.

[mcp_servers.cemu-re]
command = "tools/cemu-re-mcp/.venv/bin/python"
args = ["-m", "cemu_re_mcp.server"]
enabled = true
startup_timeout_sec = 60

[mcp_servers.tessera-playtest]
command = "tools/tessera-playtest/.venv/bin/python"
args = ["-m", "tessera_playtest.server"]
enabled = true
startup_timeout_sec = 60
