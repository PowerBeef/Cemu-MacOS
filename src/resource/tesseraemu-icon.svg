<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TesseraEmu icon">
  <defs>
    <linearGradient id="accent" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5FE3E8"/>
      <stop offset="0.55" stop-color="#5AA8F2"/>
      <stop offset="1" stop-color="#8B6FF5"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B1F2C"/>
      <stop offset="1" stop-color="#0C0E15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.20" r="0.85">
      <stop offset="0" stop-color="#5AA8F2" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#5AA8F2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#plate)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>

  <!-- field tesserae -->
  <g fill="url(#accent)" opacity="0.16">
    <rect x="96"     y="162.75" width="53" height="53" rx="12"/>
    <rect x="162.75" y="162.75" width="53" height="53" rx="12"/>
    <rect x="296.25" y="162.75" width="53" height="53" rx="12"/>
    <rect x="363"    y="162.75" width="53" height="53" rx="12"/>

    <rect x="96"     y="229.5"  width="53" height="53" rx="12"/>
    <rect x="162.75" y="229.5"  width="53" height="53" rx="12"/>
    <rect x="296.25" y="229.5"  width="53" height="53" rx="12"/>
    <rect x="363"    y="229.5"  width="53" height="53" rx="12"/>

    <rect x="96"     y="296.25" width="53" height="53" rx="12"/>
    <rect x="162.75" y="296.25" width="53" height="53" rx="12"/>
    <rect x="296.25" y="296.25" width="53" height="53" rx="12"/>
    <rect x="363"    y="296.25" width="53" height="53" rx="12"/>

    <rect x="96"     y="363"    width="53" height="53" rx="12"/>
    <rect x="162.75" y="363"    width="53" height="53" rx="12"/>
    <rect x="296.25" y="363"    width="53" height="53" rx="12"/>
  </g>

  <!-- one tile mid-resolve: the mosaic is still being laid -->
  <rect x="363" y="363" width="53" height="53" rx="12" fill="url(#accent)" opacity="0.48"/>

  <!-- the T -->
  <g fill="url(#accent)">
    <rect x="96"     y="96" width="53" height="53" rx="12"/>
    <rect x="162.75" y="96" width="53" height="53" rx="12"/>
    <rect x="229.5"  y="96" width="53" height="53" rx="12"/>
    <rect x="296.25" y="96" width="53" height="53" rx="12"/>
    <rect x="363"    y="96" width="53" height="53" rx="12"/>

    <rect x="229.5" y="162.75" width="53" height="53" rx="12"/>
    <rect x="229.5" y="229.5"  width="53" height="53" rx="12"/>
    <rect x="229.5" y="296.25" width="53" height="53" rx="12"/>
    <rect x="229.5" y="363"    width="53" height="53" rx="12"/>
  </g>
</svg>
